services:
  api:
    build: .
    container_name: masign-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      # Inside the compose network the services are reached by name, not localhost.
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/contract_rag
      VECTOR_STORE_URL: http://qdrant:6333
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: masign-postgres
    environment:
      # Dev-only credentials; they match .env.example and never leave the compose network.
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: contract_rag
    ports:
      # Host port 5433: a native PostgreSQL service commonly occupies 5432 on
      # dev machines. Inside the compose network it is still postgres:5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d contract_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: masign-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  uploads:
