# The `quality`-*only* embedding profile (MAS-58/61): repoints the default
# profile at Qwen3-Embedding-4B Q4_K_M via llama-server, instead of
# ModernBERT in-process, for a deployment that wants the GPU model and
# nothing else running. Needs docker-compose.llama-server.yml too (split out
# in MAS-169: this file's own `environment:` values are literal, so they
# always beat .env regardless of file order, which made this file
# unsuitable for compare mode -- see docker-compose.llama-server.yml and
# README.md's "Compare mode" section for running both profiles side by
# side instead of swapping).
#
#   docker compose -f docker-compose.yml -f docker-compose.llama-server.yml -f docker-compose.quality.yml up --build
#
# Switching profiles changes the index fingerprint, so the api rebuilds the
# Qdrant collection from the stored chunk text on its next start (MAS-52);
# nothing has to be re-uploaded.

services:
  api:
    environment:
      EMBEDDING_BACKEND: openai-compatible
      EMBEDDING_API_URL: http://llama-server:8081
      # LLAMA_MODEL (not EMBEDDING_MODEL, which .env pins to the portable
      # model) names the GGUF for both services; the api records it in the
      # index fingerprint, and the prefix scheme is derived from it again.
      EMBEDDING_MODEL: ${LLAMA_MODEL:-Qwen/Qwen3-Embedding-4B-GGUF:Q4_K_M}
      EMBEDDING_PROMPT_FORMAT: ""
    depends_on:
      llama-server:
        condition: service_healthy
